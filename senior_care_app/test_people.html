<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test People API - Senior Care</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101316;
      color: #f4f7f8;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 600px;
      margin: 20px auto;
      padding: 24px;
      background: #202a31;
      border: 1px solid #3d5967;
      border-radius: 16px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
      box-sizing: border-box;
    }

    input {
      background: #151c20;
      color: white;
      border: 1px solid #526976;
    }

    button {
      margin-top: 14px;
      border: 0;
      background: #32d1dc;
      color: #09353d;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 18px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .person {
      margin-top: 12px;
      padding: 12px;
      background: #18242b;
      border-radius: 9px;
    }
  </style>
</head>
<body>
<main>
  <h1>Care Circle Test</h1>
  <p>Add a person to the signed-in account and retrieve the saved records.</p>

  <form id="personForm">
    <label for="name">Person's name</label>
    <input id="name" name="name" required minlength="2"
           maxlength="100" placeholder="e.g. Test Senior Two">

    <button id="addButton" type="submit">Add Person</button>
  </form>

  <button id="loadButton" type="button">Load People</button>

  <p id="result" role="status" aria-live="polite"></p>
  <section>
    <h2>Saved People</h2>
    <div id="peopleList">Click Load People to see records.</div>
  </section>
</main>

<script>
  const form = document.getElementById("personForm");
  const nameInput = document.getElementById("name");
  const result = document.getElementById("result");
  const peopleList = document.getElementById("peopleList");
  const addButton = document.getElementById("addButton");
  const loadButton = document.getElementById("loadButton");

  async function requestApi(method, body) {
    const options = {
      method,
      credentials: "same-origin",
      headers: { "Accept": "application/json" }
    };

    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }

    const response = await fetch("api/people.php", options);
    const text = await response.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        "Server returned a non-JSON response. HTTP " +
        response.status + ": " + text.slice(0, 300)
      );
    }

    if (!response.ok || !data.success) {
      throw new Error(data.message || "Request failed.");
    }

    return data;
  }

  function showMessage(message) {
    result.textContent = message;
  }

  async function loadPeople() {
    loadButton.disabled = true;

    try {
      const data = await requestApi("GET");
      peopleList.replaceChildren();

      if (data.people.length === 0) {
        peopleList.textContent = "No people have been added yet.";
      } else {
        data.people.forEach(person => {
          const item = document.createElement("div");
          item.className = "person";

          // textContent safely displays the name.
          item.textContent =
            person.name + " — Person ID: " + person.id;

          peopleList.appendChild(item);
        });
      }

      showMessage("People loaded successfully. Count: " + data.people.length);
    } catch (error) {
      showMessage("Error: " + error.message);
    } finally {
      loadButton.disabled = false;
    }
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    addButton.disabled = true;

    try {
      const name = nameInput.value.trim();
      const data = await requestApi("POST", { name });

      showMessage(
        data.message + "\nPerson ID: " + data.person.id
      );

      nameInput.value = "";
      await loadPeople();
    } catch (error) {
      showMessage("Error: " + error.message);
    } finally {
      addButton.disabled = false;
    }
  });

  loadButton.addEventListener("click", loadPeople);
</script>
</body>
</html>
