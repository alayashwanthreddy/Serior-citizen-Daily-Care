<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Water Tracking Test - Senior Care</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background: #101316;
      color: #f4f7f8;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 480px;
      margin: 35px auto;
      padding: 28px;
      background: #202a31;
      border: 1px solid #3d5967;
      border-radius: 18px;
    }

    h1 {
      font-size: 28px;
    }

    p {
      color: #c0cbd1;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      background: #151c20;
      border: 1px solid #526976;
      color: white;
    }

    button {
      margin-top: 16px;
      background: #32d1dc;
      color: #09353d;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: transparent;
      color: white;
      border: 1px solid #526976;
    }

    .water-count {
      font-size: 26px;
      font-weight: bold;
      color: #32d1dc;
    }

    .glasses {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .glass {
      width: 30px;
      height: 40px;
      border: 2px solid #82bbd0;
      border-radius: 6px 6px 10px 10px;
    }

    .glass.filled {
      background: #32d1dc;
      border-color: #32d1dc;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #163b2d;
      color: #9af0bf;
    }

    .error {
      display: block !important;
      background: #482626;
      color: #ffb5b5;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>💧 Water Tracking</h1>

    <p>
      Test saving today's water intake for test_senior.
      The data will be stored in your MySQL water_logs table.
    </p>

    <label for="personId">Person ID</label>
    <input
      type="number"
      id="personId"
      value="3"
      min="1"
      required>

    <button type="button" id="loadButton" class="secondary">
      Load Today's Water Intake
    </button>

    <p class="water-count" id="waterCount">0 of 8 glasses</p>

    <div class="glasses" id="glassesDisplay"></div>

    <label for="glassesInput">Number of glasses today</label>
    <input
      type="number"
      id="glassesInput"
      value="0"
      min="0"
      max="8"
      step="1"
      required>

    <button type="button" id="saveButton">
      Save Water Intake
    </button>

    <div id="result" role="status" aria-live="polite"></div>

  </main>

  <script>
    const personInput = document.getElementById("personId");
    const glassesInput = document.getElementById("glassesInput");
    const waterCount = document.getElementById("waterCount");
    const glassesDisplay = document.getElementById("glassesDisplay");
    const result = document.getElementById("result");
    const loadButton = document.getElementById("loadButton");
    const saveButton = document.getElementById("saveButton");

    function showResult(message, success) {
      result.className = success ? "success" : "error";
      result.textContent = message;
    }

    function renderGlasses(count) {
      waterCount.textContent = count + " of 8 glasses";

      glassesDisplay.replaceChildren();

      for (let i = 0; i < 8; i++) {
        const glass = document.createElement("span");
        glass.className = "glass" + (i < count ? " filled" : "");
        glassesDisplay.appendChild(glass);
      }
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
          "Accept": "application/json",
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(
          "Server returned a non-JSON response. HTTP " +
          response.status + ": " + text.slice(0, 300)
        );
      }

      if (!response.ok || !data.success) {
        throw new Error(
          data.message || "The request failed."
        );
      }

      return data;
    }

    async function loadWater() {
      const personId = Number(personInput.value);

      if (!Number.isInteger(personId) || personId < 1) {
        showResult("Enter a valid person ID.", false);
        return;
      }

      loadButton.disabled = true;

      try {
        const data = await apiRequest(
          "api/water.php?person_id=" +
          encodeURIComponent(personId)
        );

        glassesInput.value = data.glasses;
        renderGlasses(data.glasses);

        showResult(
          "Water intake loaded successfully.\n" +
          "Date: " + data.log_date + "\n" +
          "Glasses: " + data.glasses,
          true
        );

      } catch (error) {
        showResult("Load failed: " + error.message, false);

      } finally {
        loadButton.disabled = false;
      }
    }

    async function saveWater() {
      const personId = Number(personInput.value);
      const glasses = Number(glassesInput.value);

      if (!Number.isInteger(personId) || personId < 1) {
        showResult("Enter a valid person ID.", false);
        return;
      }

      if (
        !Number.isInteger(glasses) ||
        glasses < 0 ||
        glasses > 8
      ) {
        showResult(
          "Enter a whole number between 0 and 8.",
          false
        );
        return;
      }

      saveButton.disabled = true;

      try {
        const data = await apiRequest("api/water.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            person_id: personId,
            glasses: glasses
          })
        });

        renderGlasses(data.glasses);

        showResult(
          data.message + "\n" +
          "Date: " + data.log_date + "\n" +
          "Glasses saved: " + data.glasses + " of 8",
          true
        );

      } catch (error) {
        showResult("Save failed: " + error.message, false);

      } finally {
        saveButton.disabled = false;
      }
    }

    loadButton.addEventListener("click", loadWater);
    saveButton.addEventListener("click", saveWater);

    renderGlasses(0);
  </script>

</body>
</html>
