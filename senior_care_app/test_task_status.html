<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Task Status - Senior Care</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 16px;
      background: #101316;
      color: #f4f7f8;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 26px;
      background: #202a31;
      border: 1px solid #3d5967;
      border-radius: 18px;
    }

    h1 {
      font-size: 27px;
    }

    p {
      color: #c0cbd1;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
    }

    select {
      color: white;
      background: #151c20;
      border: 1px solid #526976;
    }

    button {
      border: none;
      background: #32d1dc;
      color: #09353d;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .skip {
      background: #ffad63;
      color: #38210e;
    }

    .secondary {
      margin-top: 12px;
      background: transparent;
      border: 1px solid #526976;
      color: white;
    }

    #result {
      display: none;
      padding: 14px;
      margin-top: 20px;
      border-radius: 10px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #163b2d;
      color: #9af0bf;
    }

    .error {
      display: block !important;
      background: #482626;
      color: #ffb5b5;
    }

    .task-card {
      padding: 15px;
      margin-top: 18px;
      background: #18242b;
      border: 1px solid #40535d;
      border-radius: 12px;
    }

    .status {
      color: #32d1dc;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Test Activity Status</h1>

    <p>
      Select an existing activity and mark it as Done or Skip.
      The status should be stored in your MySQL task_logs table.
    </p>

    <label for="personId">Person ID</label>
    <select id="personId">
      <option value="3">Test Senior (ID 3)</option>
    </select>

    <button type="button" id="loadButton" class="secondary">
      Load Activities
    </button>

    <label for="taskSelect">Choose an activity</label>
    <select id="taskSelect">
      <option value="">Click Load Activities first</option>
    </select>

    <div class="actions">
      <button type="button" id="doneButton">
        Mark Done
      </button>

      <button type="button" id="skipButton" class="skip">
        Mark Skip
      </button>
    </div>

    <div id="result" role="status" aria-live="polite"></div>

    <div class="task-card">
      <h3>Selected Activity</h3>
      <p id="taskDetails">No activity selected.</p>
    </div>
  </main>

  <script>
    const personId = document.getElementById("personId");
    const taskSelect = document.getElementById("taskSelect");
    const loadButton = document.getElementById("loadButton");
    const doneButton = document.getElementById("doneButton");
    const skipButton = document.getElementById("skipButton");
    const result = document.getElementById("result");
    const taskDetails = document.getElementById("taskDetails");

    let tasks = [];

    function showResult(message, success) {
      result.className = success ? "success" : "error";
      result.textContent = message;
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
          "Accept": "application/json",
          ...(options.headers || {})
        }
      });

      const text = await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(
          "The server did not return JSON. HTTP " +
          response.status + ": " + text.slice(0, 300)
        );
      }

      if (!response.ok || !data.success) {
        throw new Error(
          data.message || "The request failed."
        );
      }

      return data;
    }

    function updateTaskDetails() {
      const id = Number(taskSelect.value);
      const task = tasks.find(item => Number(item.id) === id);

      if (!task) {
        taskDetails.textContent = "No activity selected.";
        return;
      }

      taskDetails.textContent =
        "Name: " + task.title + "\n" +
        "Time: " + task.task_time + "\n" +
        "Category: " + task.category + "\n" +
        "Today's status: " + (task.today_status || "Pending") + "\n" +
        "Task ID: " + task.id;
    }

    async function loadTasks() {
      loadButton.disabled = true;

      try {
        const data = await apiRequest(
          "api/tasks.php?person_id=" +
          encodeURIComponent(personId.value)
        );

        tasks = data.tasks;

        taskSelect.replaceChildren();

        if (tasks.length === 0) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "No activities found";
          taskSelect.appendChild(option);

          taskDetails.textContent = "No activities found.";
          showResult("No activities are saved for this person yet.", true);
          return;
        }

        tasks.forEach(task => {
          const option = document.createElement("option");
          option.value = String(task.id);
          option.textContent =
            task.title + " — " + task.task_time +
            " (ID " + task.id + ")";
          taskSelect.appendChild(option);
        });

        updateTaskDetails();

        showResult(
          "Activities loaded successfully. Count: " + tasks.length,
          true
        );

      } catch (error) {
        showResult("Could not load activities: " + error.message, false);

      } finally {
        loadButton.disabled = false;
      }
    }

    async function saveStatus(status) {
      const taskId = Number(taskSelect.value);

      if (!taskId) {
        showResult("Load and select an activity first.", false);
        return;
      }

      doneButton.disabled = true;
      skipButton.disabled = true;

      try {
        const data = await apiRequest("api/task_status.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            task_id: taskId,
            status: status
          })
        });

        showResult(
          data.message + "\n" +
          "Task ID: " + data.task_id + "\n" +
          "Status: " + data.status + "\n" +
          "Date: " + data.log_date,
          true
        );

        // Reload from MySQL to verify the status was saved.
        await loadTasks();

      } catch (error) {
        showResult("Could not save status: " + error.message, false);

      } finally {
        doneButton.disabled = false;
        skipButton.disabled = false;
      }
    }

    loadButton.addEventListener("click", loadTasks);
    taskSelect.addEventListener("change", updateTaskDetails);

    doneButton.addEventListener("click", () => saveStatus("done"));
    skipButton.addEventListener("click", () => saveStatus("skip"));
  </script>
</body>
</html>
